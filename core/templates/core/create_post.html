{% extends 'core/base.html' %}

{% block content %}
<div class="post-form-container">
    <a href="{% url 'post_list' %}"
        style="display: inline-block; margin-bottom: 20px; font-weight: 700; font-size: 1.1rem;">&larr; Back to Feed</a>
    <h2 style="margin-bottom: 20px; font-size: 2rem;">Write something</h2>

    {% if error %}
    <div
        style="background: rgba(220, 38, 38, 0.2); border: 2px solid rgba(220, 38, 38, 0.5); color: #fecaca; padding: 15px; margin-bottom: 20px; box-shadow: 4px 4px 0px var(--shadow-color);">
        {{ error }}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 10px; font-weight: 700;">Content</label>
            {{ form.content }}
        </div>

        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 10px; font-weight: 700;">Type of Thought</label>
            {{ form.post_type }}
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Post Anonymously</button>
    </form>
</div>
{% endblock %}
