{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=REDACTED_GA_ID"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'REDACTED_GA_ID');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krine</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'core/main.css' %}?v=14">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="{% url 'post_list' %}" class="logo">
                <img src="{% static 'core/images/logo.png' %}" alt="Krine Logo">
            </a>

            <!-- Mobile Actions Container -->
            <div class="mobile-actions">
                <a href="{% url 'create_post' %}" class="btn btn-primary mobile-new-post">+ Post</a>
                <button class="menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>

            <div class="nav-links">
                <a href="{% url 'about' %}" class="nav-item">About</a>
                <a href="{% url 'mission' %}" class="nav-item">Mission</a>
                <a href="{% url 'faq' %}" class="nav-item">FAQ</a>

                <div class="dropdown">
                    <span class="nav-item">Legal & Compliance ▾</span>
                    <div class="dropdown-content">
                        <a href="{% url 'legal' %}">Terms & Privacy</a>
                        <a href="{% url 'security' %}">Security</a>
                        <a href="{% url 'safety' %}">Safety</a>
                    </div>
                </div>

                <a href="{% url 'create_post' %}" class="btn btn-primary desktop-new-post">+ New Post</a>
            </div>
        </div>
    </nav>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                menuToggle.classList.toggle('active');
                navLinks.classList.toggle('active');
                document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : '';
            });
        }

        // Close menu/reset when clicking links
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
                document.body.style.overflow = '';
            });
        });
    </script>

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <h2 class="footer-logo">KRINE</h2>
        <p>&copy; 2026 Krine. Anonymous & Safe.</p>
    </footer>
</body>

</html>
